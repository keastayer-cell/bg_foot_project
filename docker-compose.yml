services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-football_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD не задан - скопируйте .env.example в .env}
      POSTGRES_DB: ${DB_NAME:-football_db}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    profiles: [app]
    build:
      context: ./app
    env_file:
      - .env
    environment:
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      MAILER_TRIGGER_URL: http://mailer:8090/internal/notifications/process
      APP_PUBLIC_WEB_URL: http://127.0.0.1:5173
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  mailer:
    profiles: [app]
    build:
      context: ./mailer
    env_file:
      - .env
    environment:
      MAILER_DB_HOST: postgres
      MAILER_DB_PORT: 5432
      DB_HOST: postgres
      DB_PORT: 5432
      MAILER_PORT: 8090
      MAILER_TRANSPORT_TYPE: ${MAILER_TRANSPORT_TYPE:-log}
    ports:
      - "${MAILER_HOST_PORT:-8090}:8090"
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8090/actuator/health/readiness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    profiles: [app]
    build:
      context: ./web
    environment:
      VITE_API_BASE_URL: "http://127.0.0.1:${BACKEND_HOST_PORT:-8080}"
      VITE_DEBUG_API_LOGS: ${VITE_DEBUG_API_LOGS:-false}
      VITE_DEMO_TOOLS_ENABLED: ${DEMO_TOOLS_ENABLED:-false}
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
  web_node_modules:
