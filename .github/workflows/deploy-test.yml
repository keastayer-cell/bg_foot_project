name: Deploy Test

on:
  push:
    branches:
      - test
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_API_BASE_URL: http://${{ secrets.TEST_VPS_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build backend
        run: mvn -DskipTests clean package -f app/pom.xml

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Pack frontend
        run: tar -C web/dist -czf football-stats-web-dist.tgz .

      - name: Upload backend jar
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TEST_VPS_HOST }}
          username: ${{ secrets.TEST_VPS_USER }}
          password: ${{ secrets.TEST_VPS_PASSWORD }}
          source: app/target/football-stats-app-0.0.1-SNAPSHOT.jar
          target: /root/

      - name: Upload frontend bundle
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TEST_VPS_HOST }}
          username: ${{ secrets.TEST_VPS_USER }}
          password: ${{ secrets.TEST_VPS_PASSWORD }}
          source: football-stats-web-dist.tgz
          target: /root/

      - name: Deploy on test VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_VPS_HOST }}
          username: ${{ secrets.TEST_VPS_USER }}
          password: ${{ secrets.TEST_VPS_PASSWORD }}
          script: |
            set -e
            mv /root/app/target/football-stats-app-0.0.1-SNAPSHOT.jar /opt/football-stats-app/app.jar
            rm -rf /var/www/football-stats-web/*
            tar -xzf /root/football-stats-web-dist.tgz -C /var/www/football-stats-web
            rm -f /root/football-stats-web-dist.tgz
            systemctl restart football-stats-app
            nginx -t
            systemctl reload nginx