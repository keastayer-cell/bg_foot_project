name: Deploy Test

on:
  push:
    branches:
      - test
  workflow_dispatch:

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_API_BASE_URL: http://${{ secrets.TEST_VPS_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate migration files
        run: bash scripts/validate-migrations.sh

      - name: Test and build backend
        run: mvn --batch-mode --no-transfer-progress clean verify -f app/pom.xml

      - name: Test and build mailer
        run: mvn --batch-mode --no-transfer-progress clean verify -f mailer/pom.xml

      - name: Test and build frontend
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Pack release
        run: |
          mkdir -p release
          cp app/target/football-stats-app-0.0.1-SNAPSHOT.jar release/app.jar
          cp mailer/target/football-stats-mailer-0.0.1-SNAPSHOT.jar release/mailer.jar
          tar -C web/dist -czf release/web-dist.tgz .
          cp scripts/deploy-test-remote.sh release/
          cp scripts/smoke-check.sh release/
          cp scripts/db-backup.sh release/
          cp -R ops release/
          printf '%s\n' '${{ github.sha }}' > release/git-sha

      - name: Upload release
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.TEST_VPS_HOST }}
          username: ${{ secrets.TEST_VPS_USER }}
          password: ${{ secrets.TEST_VPS_PASSWORD }}
          source: release
          target: /tmp/bg-foot-${{ github.sha }}

      - name: Deploy on test VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.TEST_VPS_HOST }}
          username: ${{ secrets.TEST_VPS_USER }}
          password: ${{ secrets.TEST_VPS_PASSWORD }}
          script: |
            set -euo pipefail
            release_root=/tmp/bg-foot-${{ github.sha }}/release
            chmod +x "$release_root"/*.sh
            RELEASE_ID=${{ github.sha }} bash "$release_root/deploy-test-remote.sh" "$release_root"
            rm -rf /tmp/bg-foot-${{ github.sha }}

      - name: Public post-deploy smoke
        run: bash scripts/smoke-check.sh --base-url "http://${{ secrets.TEST_VPS_HOST }}" --retries 15

      - name: Rollback guidance
        if: failure()
        run: |
          {
            echo '### Test deploy failed'
            echo
            echo 'The remote deploy automatically restores the previous jars and frontend bundle.'
            echo 'Flyway migrations are forward-only and are not rolled back automatically.'
            echo 'Inspect the backup path in the deploy log before considering an explicit database restore.'
          } >> "$GITHUB_STEP_SUMMARY"
