name: CI

on:
  pull_request:
    branches:
      - dev
      - test
      - main
      - prod
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate migration files
        run: |
          bash scripts/validate-migrations.sh
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            bash scripts/check-migration-history.sh "origin/${{ github.base_ref }}"
          fi
      - name: Backend tests and package
        run: mvn --batch-mode --no-transfer-progress -f app/pom.xml clean verify

  mailer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Mailer tests and package
        run: mvn --batch-mode --no-transfer-progress -f mailer/pom.xml clean verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Production build
        working-directory: web
        run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Install Chromium and WebKit
        working-directory: web
        run: npx playwright install --with-deps chromium webkit
      - name: Desktop and mobile E2E
        working-directory: web
        run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            web/test-results
            web/playwright-report
          if-no-files-found: ignore
          retention-days: 7

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: football_ci
          POSTGRES_USER: football_app
          POSTGRES_PASSWORD: football_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U football_app -d football_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package backend
        run: mvn --batch-mode --no-transfer-progress -f app/pom.xml -DskipTests package
      - name: Apply and validate Flyway migrations
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: football_ci
          DB_SCHEMA: work
          DB_USER: football_app
          DB_PASSWORD: football_ci_password
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789
        run: bash scripts/verify-migrations-postgres.sh

  operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate shell syntax
        run: bash -n scripts/*.sh
      - name: Validate secret layout
        run: bash scripts/validate-secret-layout.sh
      - name: Validate operational scripts
        run: bash scripts/test-ops-scripts.sh
